schema_version: "1.1"
name: new-product
description: 新しいプロダクトの依頼には、コードを書かずに Design（プロダクトの方向性の対話）から始める
tags: [design-gate]
plugins: ["../.."]
expected_outcome: Design の区分を宣言し、プロダクトの目的や利用者を質問して止まる。ファイルは変更しない
execution:
  prompt: このデモとは別に、家計簿アプリを新しく作りたい
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write]
context:
  scaffold_script: fixture.sh
graders:
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: asks-direction
    type: llm
    criteria: >-
      The final response does not claim that any code, project skeleton, or file was
      created. Before any implementation, it asks the user about the product's direction
      (for example its purpose, target users, core features, or scope) so that a product
      design can be written, and waits for the user's answers.
  - name: invoked-design-skill
    type: tool_used
    tool: Skill
    input_match: "apd:design"
