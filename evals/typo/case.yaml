schema_version: "1.1"
name: typo
description: typo 修正には設計を求めず、そのまま直す（割り込まない）
tags: [no-overreach]
plugins: ["../.."]
expected_outcome: 区分の宣言や Plan の提示をせず、README の typo を直す
execution:
  prompt: README の Instalation のスペルミスを直して
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write]
context:
  scaffold_script: fixture.sh
graders:
  - name: fixed-readme
    type: regex
    target: { source: file, path: README.md }
    pattern: "## Installation"
  - name: no-design-declaration
    type: regex
    target: last_message
    pattern: "(Plan|Spec|Design) ?で設計|承認(して|を)ください|この方向で(よければ|進めて)"
    match: not_contains
  - name: no-apd-skill
    type: tool_used
    tool: Skill
    input_match: "apd:(plan|spec|design|init)"
    min: 0
    max: 0
    arm: both
