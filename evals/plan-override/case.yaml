schema_version: "1.1"
name: plan-override
description: ユーザーが区分を指定したら、それに従う（本来 Spec になる依頼でも Plan で進める）
tags: [design-gate]
plugins: ["../.."]
expected_outcome: apd:plan で Plan を提示して承認を待つ。Spec や init に進まない。ファイルは変更しない
execution:
  prompt: カートに商品数の表示を足したい。Spec じゃなくて Plan でいい
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write]
context:
  scaffold_script: fixture.sh
graders:
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-spec-or-init
    type: tool_used
    tool: Skill
    input_match: "apd:(spec|init|design)"
    min: 0
    max: 0
    arm: both
  - name: presents-plan
    type: llm
    criteria: >-
      The final response does not claim that the feature was implemented and does not
      push the user toward writing a Spec or initializing a framework instead. It presents
      a plan (the goal, which files would be changed and how, and how it would be verified)
      and asks the user to approve it before implementing.
  - name: invoked-plan-skill
    type: tool_used
    tool: Skill
    input_match: "apd:plan"
