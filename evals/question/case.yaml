schema_version: "1.1"
name: question
description: 質問には答えるだけで、区分の宣言も設計もしない（割り込まない）
tags: [no-overreach]
plugins: ["../.."]
expected_outcome: formatPrice が src/cart.ts から呼ばれていると答える。ファイルは変更しない
execution:
  prompt: formatPrice ってどこから呼ばれてる？
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write]
context:
  scaffold_script: fixture.sh
graders:
  - name: answers-cart
    type: regex
    target: last_message
    pattern: "cart"
  - name: no-design-declaration
    type: regex
    target: last_message
    pattern: "(Plan|Spec|Design) ?で設計|承認(して|を)ください|この方向で(よければ|進めて)"
    match: not_contains
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-apd-skill
    type: tool_used
    tool: Skill
    input_match: "apd:(plan|spec|design|init)"
    min: 0
    max: 0
    arm: both
