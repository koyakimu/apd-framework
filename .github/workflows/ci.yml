name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON manifests
        run: |
          jq empty .claude-plugin/plugin.json
          jq empty .claude-plugin/marketplace.json
          jq empty hooks/hooks.json

      - name: Check version consistency (plugin.json / marketplace.json / CHANGELOG)
        run: |
          PLUGIN_VER=$(jq -r '.version' .claude-plugin/plugin.json)
          MARKET_VER=$(jq -r '.plugins[] | select(.name == "apd") | .version' .claude-plugin/marketplace.json)
          CHANGELOG_VER=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ')
          echo "plugin.json=$PLUGIN_VER marketplace.json=$MARKET_VER CHANGELOG=$CHANGELOG_VER"
          [[ "$PLUGIN_VER" == "$MARKET_VER" ]] || { echo "::error::version differs between plugin.json and marketplace.json"; exit 1; }
          [[ "$PLUGIN_VER" == "$CHANGELOG_VER" ]] || { echo "::error::the first CHANGELOG.md entry does not match the version"; exit 1; }

      - name: Check SKILL.md frontmatter
        run: |
          fail=0
          for f in skills/*/SKILL.md; do
            head -1 "$f" | grep -q '^---$' || { echo "::error file=$f::missing frontmatter"; fail=1; }
            grep -q '^name:' "$f" || { echo "::error file=$f::missing 'name:'"; fail=1; }
            grep -q '^description:' "$f" || { echo "::error file=$f::missing 'description:'"; fail=1; }
          done
          exit $fail

      - name: Check templates match current frontmatter model
        run: |
          # The bundled templates must not contain old fields that verify-migration.sh reports as FAIL
          if grep -nE '^(cycle_ref|created_at|amendment_id|patch_id):' templates/*.md; then
            echo "::error::templates/ still has old frontmatter fields (contradicts verify-migration.sh)"
            exit 1
          fi

      - name: Eval fixtures are in sync
        run: |
          fail=0
          for f in evals/*/fixture.sh; do
            cmp -s evals/_fixture/fixture.sh "$f" || { echo "::error file=$f::differs from evals/_fixture/fixture.sh (run scripts/sync-eval-fixtures.sh)"; fail=1; }
          done
          exit $fail

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      - name: Scripts are executable
        run: |
          for f in scripts/*.sh; do
            [[ -x "$f" ]] || { echo "::error file=$f::not executable (chmod +x)"; exit 1; }
          done

  # Tag each version merged into main as v{version}.
  # bump-version.sh runs before the commit exists and cannot tag, and manual tagging gets forgotten, so CI does it.
  tag-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag release if missing
        run: |
          VERSION=$(jq -r '.version' .claude-plugin/plugin.json)
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Tagged $TAG"
