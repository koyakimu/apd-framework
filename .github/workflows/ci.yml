name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON manifests
        run: |
          jq empty .claude-plugin/plugin.json
          jq empty .claude-plugin/marketplace.json
          jq empty hooks/hooks.json

      - name: Check version consistency (plugin.json / marketplace.json / CHANGELOG)
        run: |
          PLUGIN_VER=$(jq -r '.version' .claude-plugin/plugin.json)
          MARKET_VER=$(jq -r '.plugins[] | select(.name == "apd") | .version' .claude-plugin/marketplace.json)
          CHANGELOG_VER=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ')
          echo "plugin.json=$PLUGIN_VER marketplace.json=$MARKET_VER CHANGELOG=$CHANGELOG_VER"
          [[ "$PLUGIN_VER" == "$MARKET_VER" ]] || { echo "::error::plugin.json と marketplace.json の version が不一致"; exit 1; }
          [[ "$PLUGIN_VER" == "$CHANGELOG_VER" ]] || { echo "::error::CHANGELOG.md の先頭エントリが version と不一致"; exit 1; }

      - name: Check SKILL.md frontmatter
        run: |
          fail=0
          for f in skills/*/SKILL.md; do
            head -1 "$f" | grep -q '^---$' || { echo "::error file=$f::frontmatter がない"; fail=1; }
            grep -q '^name:' "$f" || { echo "::error file=$f::'name:' がない"; fail=1; }
            grep -q '^description:' "$f" || { echo "::error file=$f::'description:' がない"; fail=1; }
          done
          exit $fail

      - name: Check templates match current frontmatter model
        run: |
          # verify-migration.sh が FAIL 判定する旧フィールドが同梱テンプレートに残っていないこと
          if grep -nE '^(cycle_ref|created_at|amendment_id|patch_id):' templates/*.md; then
            echo "::error::templates/ に旧 frontmatter フィールドが残っている（verify-migration.sh と矛盾）"
            exit 1
          fi

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      - name: Scripts are executable
        run: |
          for f in scripts/*.sh; do
            [[ -x "$f" ]] || { echo "::error file=$f::実行権限がない (chmod +x)"; exit 1; }
          done

  # main にマージされたバージョンへ v{version} タグを自動付与する。
  # bump-version.sh はコミット前に走るためタグを打てず、人手運用は忘れられるので CI が持つ。
  tag-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag release if missing
        run: |
          VERSION=$(jq -r '.version' .claude-plugin/plugin.json)
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Tagged $TAG"
